# Group resource def
resource: Group
provider: GroupProvider
namespace: Roghumi\Press\Crud\Resources\Group
timestamps: true
softDeletes: true
output: src/Resources/Group
factory:
  namespace: Roghumi\Press\Crud\Database\Factories
  output: database/factories

ignoreFiles:
  - migrations
  - resource

verbs:
  - verb: create
    comp: CreateComposite
  - verb: update
    comp: UpdateComposite
  - verb: query
    comp: QueryComposite
  - verb: clone
    comp: CloneComposite
  - verb: export
  - verb: delete
  - verb: restore

columns:
  - name: id
    type: string
    sort: true
    input: false
    filters:
      - equals
      - between
  - name: name
    type: string
    sort: true
    faker:
      function: name
    rules:
      - string
      - required
      - unique:
          table: groups
          column: name
        update: exclude-args-0
        clone: names.*
    filters:
      - equals
      - contains
  - name: author_id
    type: string
    sort: true
    input: auth_id
    faker: 1
    filters:
      - equals
      - between
  - name: options
    type: numeric
    default: 0
    sort: true
    faker: 0
    rules: numeric|nullable|min:0
    filters:
      - equals

relations:
  - name: author
    type: BelongsTo
    props:
      - author_id
    provider: user.provider
    class: user.class